<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Classes — Comunidade e Engajamento</title>
  <desc id="desc">Modelo estático UML da SubEquipe 02 com usuários, perfil público, reputação, votos, conteúdo votável, eventos de reputação, medalhas, privilégios e recompensas.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #263238; }
      .subtitle { font: 16px Arial, sans-serif; fill: #546E7A; }
      .box { fill: #FFFFFF; stroke: #263238; stroke-width: 2; }
      .header { fill: #263238; }
      .stereo { font: italic 14px Arial, sans-serif; fill: #FFFFFF; }
      .name { font: 700 21px Arial, sans-serif; fill: #FFFFFF; }
      .member { font: 15px "Courier New", monospace; fill: #263238; }
      .member-muted { font: 14px "Courier New", monospace; fill: #546E7A; }
      .connector { fill: none; stroke: #455A64; stroke-width: 2; }
      .dependency { fill: none; stroke: #607D8B; stroke-width: 2; stroke-dasharray: 8 6; }
      .label { font: 14px Arial, sans-serif; fill: #37474F; paint-order: stroke; stroke: #FFFFFF; stroke-width: 5px; stroke-linejoin: round; }
      .multiplicity { font: 13px Arial, sans-serif; fill: #37474F; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; }
      .note { fill: #FFF8E1; stroke: #B08D28; stroke-width: 1.5; }
      .note-text { font: 14px Arial, sans-serif; fill: #5D4E12; }
      .legend { font: 14px Arial, sans-serif; fill: #455A64; }
      .enum-header { fill: #546E7A; }
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#FAFBFC"/>
  <text x="60" y="48" class="title">Diagrama de Classes — Comunidade e Engajamento</text>
  <text x="60" y="76" class="subtitle">SubEquipe 02 · Foco 01 — Modelagem Estática · versão 1.0</text>

  <line class="connector" x1="410" y1="170" x2="500" y2="170"/>
  <polygon points="420,170 432,162 444,170 432,178" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="430" y="157" class="multiplicity">1</text>
  <text x="468" y="157" class="multiplicity">1</text>
  <text x="448" y="148" class="label">disponibiliza</text>

  <line class="connector" x1="410" y1="270" x2="920" y2="270"/>
  <polygon points="420,270 432,262 444,270 432,278" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="430" y="258" class="multiplicity">1</text>
  <text x="875" y="258" class="multiplicity">1</text>
  <text x="590" y="248" class="label">mantém</text>

  <line class="connector" x1="235" y1="350" x2="235" y2="500"/>
  <text x="246" y="374" class="multiplicity">1</text>
  <text x="246" y="490" class="multiplicity">0..*</text>
  <text x="250" y="430" class="label">registra</text>

  <line class="connector" x1="410" y1="590" x2="500" y2="590"/>
  <text x="418" y="578" class="multiplicity">0..*</text>
  <text x="462" y="578" class="multiplicity">1</text>
  <text x="422" y="565" class="label">avalia</text>

  <path class="dependency" d="M 500 535 C 470 470, 435 395, 365 350"/>
  <text x="390" y="420" class="label">autor</text>

  <line class="connector" x1="1280" y1="240" x2="1360" y2="240"/>
  <text x="1287" y="228" class="multiplicity">1</text>
  <text x="1320" y="228" class="multiplicity">0..*</text>
  <text x="1288" y="215" class="label">registra</text>

  <path class="dependency" d="M 410 650 C 650 760, 1050 760, 1360 335"/>
  <text x="930" y="750" class="label">pode gerar evento</text>

  <path class="connector" d="M 410 300 C 610 330, 760 470, 960 570"/>
  <text x="590" y="385" class="label">recebe</text>

  <path class="dependency" d="M 410 315 C 700 365, 1060 365, 1370 555"/>
  <text x="920" y="390" class="label">acessa</text>

  <path class="dependency" d="M 1280 290 C 1320 350, 1430 430, 1515 500"/>
  <text x="1325" y="390" class="label">habilita progressivamente</text>

  <path class="connector" d="M 400 330 C 500 500, 555 740, 700 850"/>
  <text x="470" y="640" class="label">oferece</text>

  <path class="connector" d="M 850 850 C 800 790, 735 720, 690 700"/>
  <text x="760" y="770" class="label">incentiva</text>

  <g>
    <rect class="box" x="60" y="130" width="350" height="220" rx="3"/>
    <rect class="header" x="60" y="130" width="350" height="62" rx="3"/>
    <text x="82" y="151" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="82" y="178" class="name">Usuario</text>
    <line x1="60" y1="192" x2="410" y2="192" stroke="#263238" stroke-width="1.5"/>
    <text x="78" y="218" class="member">- id: UUID</text>
    <text x="78" y="242" class="member">- nome: String</text>
    <line x1="60" y1="258" x2="410" y2="258" stroke="#B0BEC5" stroke-width="1"/>
    <text x="78" y="284" class="member">+ votar(alvo, tipo)</text>
    <text x="78" y="308" class="member">+ oferecerRecompensa(alvo, valor)</text>
  </g>

  <g>
    <rect class="box" x="500" y="130" width="330" height="165" rx="3"/>
    <rect class="header" x="500" y="130" width="330" height="62" rx="3"/>
    <text x="522" y="151" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="522" y="178" class="name">PerfilPublico</text>
    <line x1="500" y1="192" x2="830" y2="192" stroke="#263238" stroke-width="1.5"/>
    <text x="518" y="218" class="member">- nomeExibicao: String</text>
    <text x="518" y="242" class="member">- resumoAtividades: String</text>
    <line x1="500" y1="258" x2="830" y2="258" stroke="#B0BEC5" stroke-width="1"/>
    <text x="518" y="282" class="member">+ exibirHistorico()</text>
  </g>

  <g>
    <rect class="box" x="920" y="130" width="360" height="220" rx="3"/>
    <rect class="header" x="920" y="130" width="360" height="62" rx="3"/>
    <text x="942" y="151" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="942" y="178" class="name">Reputacao</text>
    <line x1="920" y1="192" x2="1280" y2="192" stroke="#263238" stroke-width="1.5"/>
    <text x="938" y="218" class="member">- pontuacao: int</text>
    <line x1="920" y1="234" x2="1280" y2="234" stroke="#B0BEC5" stroke-width="1"/>
    <text x="938" y="260" class="member">+ registrar(evento)</text>
    <text x="938" y="284" class="member">+ consultarSaldo(): int</text>
  </g>

  <g>
    <rect class="box" x="1360" y="130" width="380" height="220" rx="3"/>
    <rect class="header" x="1360" y="130" width="380" height="62" rx="3"/>
    <text x="1382" y="151" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="1382" y="178" class="name">EventoReputacao</text>
    <line x1="1360" y1="192" x2="1740" y2="192" stroke="#263238" stroke-width="1.5"/>
    <text x="1378" y="218" class="member">- tipo: TipoEvento</text>
    <text x="1378" y="242" class="member">- variacao: int</text>
    <text x="1378" y="266" class="member">- ocorridoEm: DateTime</text>
    <line x1="1360" y1="282" x2="1740" y2="282" stroke="#B0BEC5" stroke-width="1"/>
    <text x="1378" y="308" class="member">+ aplicar()</text>
  </g>

  <g>
    <rect class="box" x="60" y="500" width="350" height="180" rx="3"/>
    <rect class="header" x="60" y="500" width="350" height="62" rx="3"/>
    <text x="82" y="521" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="82" y="548" class="name">Voto</text>
    <line x1="60" y1="562" x2="410" y2="562" stroke="#263238" stroke-width="1.5"/>
    <text x="78" y="588" class="member">- tipo: TipoVoto</text>
    <text x="78" y="612" class="member">- criadoEm: DateTime</text>
  </g>

  <g>
    <rect class="box" x="500" y="500" width="380" height="200" rx="3"/>
    <rect class="header" x="500" y="500" width="380" height="78" rx="3"/>
    <text x="522" y="521" class="stereo">&lt;&lt;referenciado&gt;&gt;</text>
    <text x="522" y="550" class="name">ConteudoVotavel</text>
    <line x1="500" y1="578" x2="880" y2="578" stroke="#263238" stroke-width="1.5"/>
    <text x="518" y="606" class="member">- id: UUID</text>
    <line x1="500" y1="622" x2="880" y2="622" stroke="#B0BEC5" stroke-width="1"/>
    <text x="518" y="650" class="member-muted">Pergunta, Resposta ou Comentario</text>
    <text x="518" y="674" class="member-muted">detalhes fora deste modelo</text>
  </g>

  <g>
    <rect class="box" x="960" y="500" width="330" height="180" rx="3"/>
    <rect class="header" x="960" y="500" width="330" height="62" rx="3"/>
    <text x="982" y="521" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="982" y="548" class="name">Medalha</text>
    <line x1="960" y1="562" x2="1290" y2="562" stroke="#263238" stroke-width="1.5"/>
    <text x="978" y="588" class="member">- nome: String</text>
    <text x="978" y="612" class="member">- categoria: CategoriaMedalha</text>
    <text x="978" y="636" class="member">- criterio: String</text>
  </g>

  <g>
    <rect class="box" x="1370" y="500" width="330" height="180" rx="3"/>
    <rect class="header" x="1370" y="500" width="330" height="62" rx="3"/>
    <text x="1392" y="521" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="1392" y="548" class="name">Privilegio</text>
    <line x1="1370" y1="562" x2="1700" y2="562" stroke="#263238" stroke-width="1.5"/>
    <text x="1388" y="588" class="member">- nome: String</text>
    <text x="1388" y="612" class="member">- descricao: String</text>
  </g>

  <g>
    <rect class="box" x="640" y="850" width="420" height="220" rx="3"/>
    <rect class="header" x="640" y="850" width="420" height="62" rx="3"/>
    <text x="662" y="871" class="stereo">&lt;&lt;class&gt;&gt;</text>
    <text x="662" y="898" class="name">Recompensa</text>
    <line x1="640" y1="912" x2="1060" y2="912" stroke="#263238" stroke-width="1.5"/>
    <text x="658" y="938" class="member">- valor: int</text>
    <text x="658" y="962" class="member">- estado: EstadoRecompensa</text>
    <text x="658" y="986" class="member">- criadaEm: DateTime</text>
    <line x1="640" y1="1002" x2="1060" y2="1002" stroke="#B0BEC5" stroke-width="1"/>
    <text x="658" y="1028" class="member">+ conceder()</text>
    <text x="658" y="1052" class="member">+ expirar()</text>
  </g>

  <g>
    <rect class="box" x="60" y="850" width="270" height="140" rx="3"/>
    <rect class="enum-header" x="60" y="850" width="270" height="62" rx="3"/>
    <text x="78" y="871" class="stereo">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="78" y="898" class="name">TipoVoto</text>
    <line x1="60" y1="912" x2="330" y2="912" stroke="#263238" stroke-width="1.5"/>
    <text x="78" y="940" class="member">Positivo</text>
    <text x="78" y="964" class="member">Negativo</text>
  </g>

  <g>
    <rect class="box" x="1140" y="850" width="280" height="140" rx="3"/>
    <rect class="enum-header" x="1140" y="850" width="280" height="62" rx="3"/>
    <text x="1158" y="871" class="stereo">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="1158" y="898" class="name">CategoriaMedalha</text>
    <line x1="1140" y1="912" x2="1420" y2="912" stroke="#263238" stroke-width="1.5"/>
    <text x="1158" y="940" class="member">Bronze · Prata · Ouro</text>
  </g>

  <g>
    <rect class="box" x="1470" y="850" width="270" height="190" rx="3"/>
    <rect class="enum-header" x="1470" y="850" width="270" height="62" rx="3"/>
    <text x="1488" y="871" class="stereo">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="1488" y="898" class="name">EstadoRecompensa</text>
    <line x1="1470" y1="912" x2="1740" y2="912" stroke="#263238" stroke-width="1.5"/>
    <text x="1488" y="940" class="member">Disponivel</text>
    <text x="1488" y="964" class="member">Ofertada</text>
    <text x="1488" y="988" class="member">Concedida</text>
    <text x="1488" y="1012" class="member">Expirada · Cancelada</text>
  </g>

  <rect class="note" x="60" y="1120" width="1680" height="145" rx="4"/>
  <text x="84" y="1150" class="note-text">Notas de modelagem</text>
  <text x="84" y="1178" class="legend">• ConteudoVotavel é uma abstração referenciada para pergunta, resposta ou comentário; os detalhes do conteúdo não são duplicados.</text>
  <text x="84" y="1204" class="legend">• EventoReputacao mantém o rastreamento da origem e da variação, sem fixar valores numéricos de reputação.</text>
  <text x="84" y="1230" class="legend">• EstadoRecompensa representa um ciclo de vida conceitual; regras de reserva e concessão permanecem dependentes de validação.</text>
</svg>
