<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      loadSidebar: true,
      name: 'Repositorio Template',
      repo: 'https://github.com/UnBArqDsw2025-1-Turma01/RepositorioTemplateEntrega1',
      plugins: [
        function (hook) {
          const originalSubEquipe02Assets = [
            'diagrama_classes_comunidade_engajamento_v1.svg',
            'diagrama_classes_comunidade_engajamento_v1.puml',
            'diagrama_objetos_v1.1.svg',
            'diagrama_objetos_v1.1.puml',
            'diagrama_sequencia_v1_0.svg',
            'diagrama_sequencia_v1_0.puml',
            'maquina_estados_recompensa_v1_0.svg',
            'maquina_estados_recompensa_v1_0.puml'
          ]

          hook.afterEach(function (html, next) {
            originalSubEquipe02Assets.forEach(function (asset) {
              const docsifyPath = 'Base/Relatórios/assets/' + asset
              html = html
                .replaceAll('src="./assets/' + asset + '"', 'src="' + docsifyPath + '"')
                .replaceAll('href="./assets/' + asset + '"', 'href="' + docsifyPath + '"')
                .replaceAll('href="#/./assets/' + asset + '"', 'href="' + docsifyPath + '"')
            })
            next(html)
          })
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
